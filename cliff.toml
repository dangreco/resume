# git-cliff configuration - https://git-cliff.org
# Generates CHANGELOG.md, release-PR bodies, and GitHub Release notes from
# conventional commits.
[changelog]
header = """
# Changelog\n
All notable changes to this project are documented here.\n
"""
body = """
{% if version %}\
## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim | upper_first }}\
    {% if commit.remote.pr_number %} (#{{ commit.remote.pr_number }}){% endif %}\
{% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
# CalVer: YYYY.MM.N. Deliberately does not match the older 2025.10.0b0-style
# tags, so they are ignored rather than treated as release boundaries.
tag_pattern = "[0-9]{4}\\.[0-9]{2}\\.[0-9]+"
topo_order = false
sort_commits = "oldest"
commit_parsers = [
  { message = "^Merge ", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^content", group = "<!-- 2 -->Content" },
  { message = "^style", group = "<!-- 3 -->Styling" },
  { message = "^refactor", group = "<!-- 4 -->Refactor" },
  { message = "^doc", group = "<!-- 5 -->Documentation" },
  { message = "^build\\(deps\\)", group = "<!-- 6 -->Dependencies" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "<!-- 7 -->Miscellaneous" },
  { message = "^ci", group = "<!-- 7 -->Miscellaneous" },
  { message = ".*", group = "<!-- 8 -->Other" },
]
