---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
# yamllint disable rule:line-length
# yamllint disable rule:comments
name: PR
on:
  pull_request:
jobs:
  deploy-preview:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create GitHub deployment
        uses: chrnorm/deployment-action@500aa6a23c81ffa1acf71072aee3cfa2cc2e556a # v2.0.8
        id: deployment
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: Preview
          description: "Preview for PR #${{ github.event.pull_request.number }}"

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Setup Nix cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 1G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never

      - name: Initialize Nix shell
        run: nix develop .#ci --command true

      - name: Build PDF
        run: nix develop .#ci --command task typst:build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          aws-access-key-id: ${{ secrets.AWS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload to S3
        id: s3
        run: |
          aws s3 cp _build/resume.en.pdf s3://${{ secrets.AWS_BUCKET }}/pr-${{ github.event.pull_request.number }}/resume.en.pdf
          URL=$(aws s3 presign s3://${{ secrets.AWS_BUCKET }}/pr-${{ github.event.pull_request.number }}/resume.en.pdf --expires-in 604800)
          echo "url=$URL" >> $GITHUB_OUTPUT
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

      - name: Upload PDF as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resume-pr-${{ github.event.pull_request.number }}
          path: _build/resume.en.pdf
          retention-days: 30

      - name: Update deployment status (success)
        if: success()
        uses: chrnorm/deployment-status@6df8d036fd2fee9eb82936733953da1f8382b41e # v2.0.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment-url: ${{ steps.s3.outputs.url }}
          state: "success"
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}

      - name: Update deployment status (failure)
        if: failure()
        uses: chrnorm/deployment-status@6df8d036fd2fee9eb82936733953da1f8382b41e # v2.0.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          state: "failure"
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}

      - name: Comment PR with preview
        if: success()
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: resume-preview
          message: |
            ## Resume Preview
            A preview PDF has been generated and deployed for this PR.

            **🔗 Live Preview:** [View PDF on S3](${{ steps.s3.outputs.url }})

            **📦 Artifact Download:** [resume.en.pdf](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)

            ⚠️ *Preview link expires in 7 days*

            <details>
            <summary>Deployment Details</summary>

            - **Environment:** `pr-${{ github.event.pull_request.number }}`
            - **Deployment ID:** `${{ steps.deployment.outputs.deployment_id }}`
            - **S3 Path:** `pr-${{ github.event.pull_request.number }}/resume.en.pdf`
            - **Run ID:** `${{ github.run_id }}`
            - **Retention:** 30 days
            </details>
