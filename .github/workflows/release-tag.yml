---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
# yamllint disable rule:line-length rule:comments
name: release-tag
# Fires when a release PR merges (VERSION changes on dev). Tags the release,
# fast-forwards main to the release commit, and creates a GitHub Release. Creating
# the release is what triggers Release (build, sign, attach assets, deploy to S3);
# main is only a pointer to the last released state and drives nothing.
on:
  push:
    branches: [dev]
    paths:
      - VERSION
jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # App token so the pushed tag and the created release trigger the downstream
      # Release and CD workflows (GITHUB_TOKEN would not).
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      # Every step below is individually idempotent, and none is gated on another
      # having done work. A release that fails partway (a rejected push, a hiccup
      # creating the release) is then completed by simply re-running this job,
      # rather than being skipped over because the tag already exists.
      - id: tag
        run: |
          set -euo pipefail
          VERSION=$(cat VERSION)
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "Tag ${VERSION} already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$VERSION" -m "Release $VERSION"
            git push origin "$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Fast-forward main to the release commit
        # HEAD is dev's tip (the release commit). This creates main if it is missing
        # and fast-forwards it otherwise; it is a no-op when main is already there.
        # main is always an ancestor of dev by construction, so a non-fast-forward
        # here signals real divergence and should fail.
        #
        # The release App must be a bypass actor on any ruleset protecting main,
        # or this push is rejected and no release is ever published.
        run: git push origin "HEAD:refs/heads/main"
      - name: Generate release notes
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --latest --strip header --output notes.md
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists."
            exit 0
          fi
          gh release create "$VERSION" --title "$VERSION" --notes-file notes.md
